# Local services. Redis: game state (optional locally; without it games are kept in memory).
# Postgres: accounts and saved progress. Run the API with
#   ConnectionStrings__Database="Host=localhost;Database=bluff;Username=bluff;Password=bluff_dev_password"
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: bluff
      POSTGRES_PASSWORD: bluff_dev_password
      POSTGRES_DB: bluff
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Game state + SignalR backplane. Run the API with Redis__ConnectionString=localhost:6379 to use it.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
