name: CI/CD

# Every PR and push to main runs the tests and builds the Docker image.
# Pushes to main then deploy to Cloud Run (see docs/DEPLOYMENT.md for one-time setup).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  SERVICE: bluff-or-blighty
  REPOSITORY: bluff-or-blighty

jobs:
  server:
    name: Server (build + test)
    runs-on: ubuntu-latest
    # A real Redis for the integration tests (RedisIntegrationTests): two server instances
    # share it, and players connect over WebSockets, as in production.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --logger "console;verbosity=normal"
        env:
          REDIS_TEST_CONNECTION: localhost:6379
          REDIS_TEST_REQUIRED: "true" # fail, rather than skip, if Redis isn't there

  client:
    name: Client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Cloud Run
    needs: [server, client, image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.promote.outputs.url }}
    permissions:
      contents: read
      id-token: write # for Workload Identity Federation (no JSON keys)
    env:
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
    steps:
      - uses: actions/checkout@v4

      # For the smoke test (it uses the SignalR client from client/node_modules).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client

      - name: Check deploy settings
        run: |
          missing=0
          for v in GCP_PROJECT_ID GCP_REGION GCP_WIF_PROVIDER GCP_DEPLOY_SA; do
            if [ -z "${!v}" ]; then echo "::error::Repository variable $v is not set (see docs/DEPLOYMENT.md)"; missing=1; fi
          done
          exit $missing
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          GCP_DEPLOY_SA: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        id: image
        run: |
          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/${SERVICE}:${GITHUB_SHA}"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build \
            --build-arg VITE_MAP_STYLE_URL="${{ vars.VITE_MAP_STYLE_URL || 'https://tiles.openfreemap.org/styles/liberty' }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      # Optional features, switched on by repository variables (see docs/DEPLOYMENT.md):
      # - REDIS_SECRET: games live in Redis and survive deploys.
      # - DB_SECRET: accounts and saved progress, in Postgres.
      # - GOOGLE_CLIENT_ID: "Sign in with Google" (needs DB_SECRET).
      # Secrets come from Secret Manager; gcloud takes them as one comma-separated flag.
      - name: Optional settings
        id: optional
        env:
          REDIS_SECRET: ${{ vars.REDIS_SECRET }}
          DB_SECRET: ${{ vars.DB_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          secrets=()
          [ -n "$REDIS_SECRET" ] && secrets+=("Redis__ConnectionString=${REDIS_SECRET}:latest")
          [ -n "$DB_SECRET" ] && secrets+=("ConnectionStrings__Database=${DB_SECRET}:latest")
          flags=""
          [ ${#secrets[@]} -gt 0 ] && flags="--set-secrets=$(IFS=,; echo "${secrets[*]}")"
          [ -n "$GOOGLE_CLIENT_ID" ] && flags="$flags --set-env-vars=Auth__GoogleClientId=${GOOGLE_CLIENT_ID}"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "store=$([ -n "$REDIS_SECRET" ] && echo redis || echo memory)" >> "$GITHUB_OUTPUT"
          echo "accounts=$([ -n "$DB_SECRET" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # The new revision is deployed with NO traffic, tagged "candidate", and smoke-tested on its
      # own URL with the real production settings. Players only move to it if that passes, so a
      # broken build or setting (e.g. a bad Redis secret) never reaches them.
      #
      # With the REDIS_SECRET variable set, games live in Redis and survive deploys: players
      # reconnect to the new revision and rejoin. Without it, games are in memory and a deploy
      # ends them. A long request timeout keeps SignalR WebSockets open. (With Redis,
      # --max-instances can be raised; the Redis backplane links the instances.)
      - name: Deploy (no traffic yet)
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ steps.image.outputs.image }}
          no_traffic: true
          tag: candidate
          flags: >-
            --allow-unauthenticated
            --service-account=bluff-or-blighty-run@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
            --port=8080
            --min-instances=0
            --max-instances=1
            --session-affinity
            --timeout=3600
            --cpu=1
            --memory=512Mi
            ${{ steps.optional.outputs.flags }}

      - name: Smoke test the candidate
        env:
          # Also catches a missing/ignored secret: the app would quietly fall back to in-memory
          # games, or run without accounts.
          EXPECT_STORE: ${{ steps.optional.outputs.store }}
          EXPECT_ACCOUNTS: ${{ steps.optional.outputs.accounts }}
        run: |
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json \
            | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')
          [ -n "$url" ] || { echo "::error::No URL for the candidate revision"; exit 1; }
          echo "Candidate: $url"
          node scripts/smoke-test.mjs "$url" "$EXPECT_STORE" "$EXPECT_ACCOUNTS"

      - name: Send traffic to the new revision
        id: promote
        run: |
          gcloud run services update-traffic "$SERVICE" --region "$REGION" --to-latest --quiet
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format='value(status.url)')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$url/api/health"
